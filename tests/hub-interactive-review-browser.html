<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ArquiQuiz hub review entry test</title></head>
<body data-status="running">
  <pre id="result">RUNNING</pre>
  <iframe id="hub" title="Hub review entry test" style="width:1200px;height:900px"></iframe>
  <script>
    (function () {
      "use strict";
      var authKey = "quiz_hub_authenticated";
      var previousAuth = window.localStorage.getItem(authKey);
      var frame = document.getElementById("hub");
      var output = document.getElementById("result");
      function assert(value, message) { if (!value) throw new Error(message); }
      function restoreAuth() {
        if (previousAuth === null) window.localStorage.removeItem(authKey);
        else window.localStorage.setItem(authKey, previousAuth);
      }
      window.localStorage.setItem(authKey, "1");
      frame.onload = function () {
        try {
          var doc = frame.contentDocument;
          var win = frame.contentWindow;
          assert(doc.getElementById("hub-container").style.display !== "none", "Hub did not open with the existing session.");
          assert(!doc.querySelector(".hub-review-callout") && !doc.getElementById("hub-interactive-review"), "Maintenance review shortcut is still visible in the learner hub.");
          assert(doc.getElementById("hub-version").textContent.indexOf("1.2.1") !== -1, "Version was not incremented.");
          doc.getElementById("theme-toggle").click();
          assert(doc.documentElement.dataset.theme === "light", "Hub theme toggle failed.");
          restoreAuth();
          document.body.dataset.status = "pass";
          output.textContent = "PASS: signed-in learner hub omits the maintenance review shortcut and keeps the theme control";
        } catch (error) {
          restoreAuth();
          document.body.dataset.status = "fail";
          output.textContent = "FAIL: " + error.message;
        }
      };
      frame.src = "../index.html";
    })();
  </script>
</body>
</html>
